name: Deploy covered-call quote gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/covered-call-quotes/**'
      - 'scripts/build-worker-allowlist.mjs'
      - 'covered-call-lab/sp500.js'
      - 'covered-call-lab/schd.js'
      - 'covered-call-lab/data.js'
      - 'covered-call-lab/release-2.7*.js'

permissions:
  contents: write

concurrency:
  group: deploy-covered-call-quotes
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build approved ticker allowlist
        run: node scripts/build-worker-allowlist.mjs
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Store Finnhub token in Cloudflare
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        working-directory: cloudflare/covered-call-quotes
        run: printf '%s' "$FINNHUB_API_KEY" | npx wrangler secret put FINNHUB_API_KEY
      - name: Deploy gateway and record public endpoint
        working-directory: cloudflare/covered-call-quotes
        run: |
          DEPLOY_OUTPUT="$(npx wrangler deploy 2>&1 | tee /dev/stderr)"
          WORKER_URL="$(printf '%s' "$DEPLOY_OUTPUT" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -1)"
          test -n "$WORKER_URL"
          printf '{"endpoint":"%s","version":"2.7.5"}\n' "$WORKER_URL" > ../../covered-call-lab/quote-proxy.json
      - name: Publish endpoint configuration
        run: |
          if git diff --quiet -- covered-call-lab/quote-proxy.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add covered-call-lab/quote-proxy.json
          git commit -m "Configure covered-call quote gateway"
          git push
