name: Deploy Evidence Engine to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "evidence-engine/**"
      - ".github/workflows/deploy-evidence-engine.yml"

permissions:
  contents: read

concurrency:
  group: deploy-evidence-engine-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: evidence-engine
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: evidence-engine/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Verify Evidence Engine 6.5
        run: npm test
      - name: Configure public Cloudflare deployment
        run: node scripts/configure-cloudflare.mjs
      - name: Deploy production Worker
        run: npx wrangler deploy --config dist/server/wrangler.json
