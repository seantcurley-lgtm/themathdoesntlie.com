name: Deploy Evidence Engine to Cloudflare

on:
  workflow_dispatch:
    inputs:
      apply_authoritative_migration:
        description: "Apply and verify the additive longitudinal D1 migration"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-evidence-engine-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: evidence-engine
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EVIDENCE_ENGINE_D1_DATABASE_ID: ${{ secrets.EVIDENCE_ENGINE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: evidence-engine/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Verify Evidence Engine 6.5
        run: npm test
      - name: Configure public Cloudflare deployment
        run: node scripts/configure-cloudflare.mjs
      - name: Apply and verify authoritative-state migrations
        if: ${{ inputs.apply_authoritative_migration == true }}
        run: |
          npx wrangler d1 migrations apply tmdl-evidence-engine --remote --config dist/server/wrangler.json
          npx wrangler d1 execute tmdl-evidence-engine --remote --config dist/server/wrangler.json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('evaluation_records','source_manifests','security_aliases','generation_manifests','generation_events') ORDER BY name"
      - name: Deploy production Worker
        run: npx wrangler deploy --config dist/server/wrangler.json
